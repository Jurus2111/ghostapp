# Szybka kompilacja bez podpisu (gdy sekrety jeszcze nie są ustawione).
# Nie tworzy .ipa – tylko sprawdza, czy projekt się buduje.

name: Build Check (no IPA)

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  compile:
    runs-on: macos-14
    defaults:
      run:
        working-directory: GhostLink

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build for simulator (unsigned)
        run: |
          xcodebuild \
            -project GhostLink.xcodeproj \
            -scheme GhostLink \
            -configuration Debug \
            -destination "platform=iOS Simulator,name=iPhone 15" \
            CODE_SIGNING_ALLOWED=NO \
            build
