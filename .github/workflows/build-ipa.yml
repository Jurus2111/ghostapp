# GHOSTLINK – .ipa wyłącznie pod AltStore (sideload).

name: Build IPA for AltStore

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "GhostLink/**"
      - ".github/workflows/build-ipa.yml"

concurrency:
  group: altstore-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    name: GhostLink.ipa (AltStore)
    runs-on: macos-14
    timeout-minutes: 30

    defaults:
      run:
        working-directory: GhostLink

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate App Icons (jeśli brak PNG w repo)
        run: |
          ICON_DIR="GhostLink/Assets.xcassets/AppIcon.appiconset"
          if [ ! -f "$ICON_DIR/Icon-1024.png" ]; then
            python3 scripts/generate_icons.py
          fi
          ls -la "$ICON_DIR"/*.png

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build for iPhone (unsigned – AltStore podpisze)
        run: |
          set -o pipefail
          DERIVED="$RUNNER_TEMP/DerivedData"
          xcodebuild \
            -project GhostLink.xcodeproj \
            -scheme GhostLink \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$DERIVED" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            SWIFT_WHOLE_MODULE_OPTIMIZATION=NO \
            build 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log" | grep -E "error:|warning:|\*\* BUILD|BUILD FAILED" || true

          if ! grep -q "\*\* BUILD SUCCEEDED \*\*" "$RUNNER_TEMP/xcodebuild.log"; then
            echo "::error::Kompilacja nie powiodła się"
            grep "error:" "$RUNNER_TEMP/xcodebuild.log" || true
            tail -40 "$RUNNER_TEMP/xcodebuild.log"
            exit 1
          fi

          APP_PATH=$(find "$DERIVED" -path "*/Release-iphoneos/GhostLink.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find "$DERIVED" -name "GhostLink.app" -type d | head -1)
          fi
          if [ -z "$APP_PATH" ]; then
            echo "::error::Nie znaleziono GhostLink.app"
            find "$DERIVED" -type d -name "*.app"
            exit 1
          fi
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      - name: Utwórz GhostLink.ipa
        run: |
          set -e
          STAGING="$RUNNER_TEMP/ipa_staging"
          rm -rf "$STAGING"
          mkdir -p "$STAGING/Payload"
          cp -R "$APP_PATH" "$STAGING/Payload/"
          cd "$STAGING"
          zip -qr "$RUNNER_TEMP/GhostLink.ipa" Payload
          ls -lh "$RUNNER_TEMP/GhostLink.ipa"

      - name: Upload IPA (do AltStore)
        uses: actions/upload-artifact@v4
        with:
          name: GhostLink-ipa
          path: ${{ runner.temp }}/GhostLink.ipa
          if-no-files-found: error
          retention-days: 90

      - name: Instrukcja AltStore
        run: |
          echo "### GhostLink.ipa – gotowe" >> "$GITHUB_STEP_SUMMARY"
          echo "Artifacts → **GhostLink-ipa** → zainstaluj w AltStore (+)" >> "$GITHUB_STEP_SUMMARY"
