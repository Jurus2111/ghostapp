# GHOSTLINK – .ipa wyłącznie pod AltStore (sideload).

name: Build IPA for AltStore

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "GhostLink/**"
      - ".github/workflows/build-ipa.yml"

concurrency:
  group: altstore-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    name: GhostLink.ipa (AltStore)
    runs-on: macos-14
    timeout-minutes: 30

    defaults:
      run:
        working-directory: GhostLink

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate App Icons (jeśli brak PNG w repo)
        run: |
          ICON_DIR="GhostLink/Assets.xcassets/AppIcon.appiconset"
          if [ ! -f "$ICON_DIR/Icon-1024.png" ]; then
            echo "Brak ikon – generuję..."
            python3 scripts/generate_icons.py
          else
            echo "Ikony OK"
            ls -la "$ICON_DIR"/*.png
          fi

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build for iPhone (AltStore podpisze przy instalacji)
        run: |
          set -e
          DERIVED="$RUNNER_TEMP/DerivedData"
          set +e
          xcodebuild \
            -project GhostLink.xcodeproj \
            -scheme GhostLink \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$DERIVED" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="-" \
            build 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log"
          BUILD_EXIT=${PIPESTATUS[0]}
          set -e
          if [ "$BUILD_EXIT" -ne 0 ]; then
            echo "::error::xcodebuild failed (exit $BUILD_EXIT)"
            echo "=== Ostatnie 80 linii logu ==="
            tail -80 "$RUNNER_TEMP/xcodebuild.log"
            exit "$BUILD_EXIT"
          fi

          APP_PATH=$(find "$DERIVED" -name "GhostLink.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::Nie znaleziono GhostLink.app"
            find "$DERIVED" -type d -name "*.app"
            exit 1
          fi
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      - name: Utwórz GhostLink.ipa
        run: |
          set -e
          STAGING="$RUNNER_TEMP/ipa_staging"
          rm -rf "$STAGING"
          mkdir -p "$STAGING/Payload"
          cp -R "$APP_PATH" "$STAGING/Payload/"
          cd "$STAGING"
          zip -qr "$RUNNER_TEMP/GhostLink.ipa" Payload
          ls -lh "$RUNNER_TEMP/GhostLink.ipa"

      - name: Upload IPA (do AltStore)
        uses: actions/upload-artifact@v4
        with:
          name: GhostLink-ipa
          path: ${{ runner.temp }}/GhostLink.ipa
          if-no-files-found: error
          retention-days: 90

      - name: Instrukcja AltStore
        run: |
          echo "### GhostLink.ipa – gotowe do AltStore" >> "$GITHUB_STEP_SUMMARY"
          echo "1. **Artifacts** → \`GhostLink-ipa\` → \`GhostLink.ipa\`" >> "$GITHUB_STEP_SUMMARY"
          echo "2. AltStore → **+** → wybierz plik na iPhone" >> "$GITHUB_STEP_SUMMARY"
