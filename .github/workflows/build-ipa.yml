# Buduje podpisany .ipa na macOS (GitHub Actions) – do AltStore / Ad Hoc / Development.
# Wymaga sekretów – patrz: GhostLink/docs/GITHUB_ACTIONS_PL.md

name: Build IPA

on:
  workflow_dispatch:
    inputs:
      export_method:
        description: "Metoda eksportu (development = łatwiejsze z darmowym Apple ID)"
        required: true
        default: development
        type: choice
        options:
          - development
          - ad-hoc
  push:
    branches: [main, master]
    paths:
      - "GhostLink/**"
      - ".github/workflows/build-ipa.yml"

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    name: Build signed IPA
    runs-on: macos-14
    timeout-minutes: 45

    defaults:
      run:
        working-directory: GhostLink

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate secrets
        run: |
          missing=""
          [ -z "${{ secrets.BUILD_CERTIFICATE_BASE64 }}" ] && missing="$missing BUILD_CERTIFICATE_BASE64"
          [ -z "${{ secrets.P12_PASSWORD }}" ] && missing="$missing P12_PASSWORD"
          [ -z "${{ secrets.BUILD_PROVISIONING_PROFILE_BASE64 }}" ] && missing="$missing BUILD_PROVISIONING_PROFILE_BASE64"
          [ -z "${{ secrets.KEYCHAIN_PASSWORD }}" ] && missing="$missing KEYCHAIN_PASSWORD"
          [ -z "${{ secrets.APPLE_TEAM_ID }}" ] && missing="$missing APPLE_TEAM_ID"
          [ -z "${{ secrets.PROVISIONING_PROFILE_NAME }}" ] && missing="$missing PROVISIONING_PROFILE_NAME"
          if [ -n "$missing" ]; then
            echo "::error::Brakujące sekrety w repo (Settings → Secrets → Actions):$missing"
            echo "Instrukcja: GhostLink/docs/GITHUB_ACTIONS_PL.md"
            exit 1
          fi

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Import code signing certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -e
          CERT_PATH="$RUNNER_TEMP/build_certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Install provisioning profile
        env:
          BUILD_PROVISIONING_PROFILE_BASE64: ${{ secrets.BUILD_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -e
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles

          echo "$BUILD_PROVISIONING_PROFILE_BASE64" | base64 --decode -o "$PROFILE_PATH"

          UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' /dev/stdin <<< "$(security cms -D -i "$PROFILE_PATH")")
          cp "$PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/"$UUID.mobileprovision"
          echo "Installed profile UUID: $UUID"

      - name: Generate ExportOptions.plist
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PROVISIONING_PROFILE_NAME: ${{ secrets.PROVISIONING_PROFILE_NAME }}
          EXPORT_METHOD: ${{ github.event.inputs.export_method || 'development' }}
          BUNDLE_ID: edu.lab.ghostlink
        run: |
          set -e
          if [ "$EXPORT_METHOD" = "ad-hoc" ]; then
            SIGN_IDENTITY="Apple Distribution"
          else
            SIGN_IDENTITY="Apple Development"
          fi
          echo "SIGN_IDENTITY=$SIGN_IDENTITY" >> "$GITHUB_ENV"

          cp ci/ExportOptions.plist ci/ExportOptions.generated.plist
          /usr/libexec/PlistBuddy -c "Set :method $EXPORT_METHOD" ci/ExportOptions.generated.plist
          /usr/libexec/PlistBuddy -c "Set :teamID $APPLE_TEAM_ID" ci/ExportOptions.generated.plist
          /usr/libexec/PlistBuddy -c "Set :provisioningProfiles:edu.lab.ghostlink $PROVISIONING_PROFILE_NAME" ci/ExportOptions.generated.plist
          plutil -lint ci/ExportOptions.generated.plist

      - name: Archive (xcodebuild)
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PROVISIONING_PROFILE_NAME: ${{ secrets.PROVISIONING_PROFILE_NAME }}
        run: |
          set -e
          xcodebuild \
            -project GhostLink.xcodeproj \
            -scheme GhostLink \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/GhostLink.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_IDENTITY="$SIGN_IDENTITY" \
            PROVISIONING_PROFILE_SPECIFIER="$PROVISIONING_PROFILE_NAME" \
            archive

      - name: Export IPA
        run: |
          set -e
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/GhostLink.xcarchive" \
            -exportPath "$RUNNER_TEMP/ipa" \
            -exportOptionsPlist ci/ExportOptions.generated.plist

          ls -la "$RUNNER_TEMP/ipa"
          IPA_FILE=$(find "$RUNNER_TEMP/ipa" -name "*.ipa" | head -1)
          echo "IPA_PATH=$IPA_FILE" >> "$GITHUB_ENV"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: GhostLink-${{ github.run_number }}
          path: ${{ runner.temp }}/ipa/*.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        run: |
          echo "### IPA gotowe" >> "$GITHUB_STEP_SUMMARY"
          echo "Pobierz: **Actions → ten workflow → Artifacts → GhostLink-${{ github.run_number }}**" >> "$GITHUB_STEP_SUMMARY"
          echo "Plik: \`$(basename "$IPA_PATH")\`" >> "$GITHUB_STEP_SUMMARY"
