# GHOSTLINK – jedyny build: .ipa pod AltStore (sideload).
# Podpis przy instalacji robi AltStore / AltServer (Twoje Apple ID).
# Nie wymaga sekretów Apple w GitHubie.

name: Build IPA for AltStore

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "GhostLink/**"
      - ".github/workflows/build-ipa.yml"

concurrency:
  group: altstore-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    name: GhostLink.ipa (AltStore)
    runs-on: macos-14
    timeout-minutes: 30

    defaults:
      run:
        working-directory: GhostLink

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build for iPhone (AltStore podpisze przy instalacji)
        run: |
          set -e
          DERIVED="$RUNNER_TEMP/DerivedData"
          xcodebuild \
            -project GhostLink.xcodeproj \
            -scheme GhostLink \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$DERIVED" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="-" \
            build

          APP_PATH=$(find "$DERIVED" -name "GhostLink.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::Nie znaleziono GhostLink.app"
            find "$DERIVED" -type d -name "*.app"
            exit 1
          fi
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      - name: Utwórz GhostLink.ipa
        run: |
          set -e
          STAGING="$RUNNER_TEMP/ipa_staging"
          rm -rf "$STAGING"
          mkdir -p "$STAGING/Payload"
          cp -R "$APP_PATH" "$STAGING/Payload/"
          cd "$STAGING"
          zip -qr "$RUNNER_TEMP/GhostLink.ipa" Payload
          ls -lh "$RUNNER_TEMP/GhostLink.ipa"

      - name: Upload IPA (do AltStore)
        uses: actions/upload-artifact@v4
        with:
          name: GhostLink-ipa
          path: ${{ runner.temp }}/GhostLink.ipa
          if-no-files-found: error
          retention-days: 90

      - name: Instrukcja AltStore
        run: |
          echo "### GhostLink.ipa – gotowe do AltStore" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "1. **Artifacts** → pobierz \`GhostLink-ipa\` → plik \`GhostLink.ipa\`" >> "$GITHUB_STEP_SUMMARY"
          echo "2. Przenieś na iPhone (AirDrop, iCloud, kabel)" >> "$GITHUB_STEP_SUMMARY"
          echo "3. **AltStore** → My Apps → **+** → wybierz \`GhostLink.ipa\`" >> "$GITHUB_STEP_SUMMARY"
          echo "4. Ten sam komputer co **AltServer** (Wi‑Fi), odśwież aplikacje co 7 dni" >> "$GITHUB_STEP_SUMMARY"
